name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev

# Variable opcional para forzar el uso de Node.js 24 en acciones JavaScript
# y eliminar las advertencias de deprecación de Node.js 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Importante para que semantic-release pueda hacer push usando el token adecuado
          persist-credentials: false
          fetch-depth: 0

      # Paso añadido para instalar Java 21, necesario para compilar el plugin
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'      # Distribución de Eclipse Temurin (antes AdoptOpenJDK)
          java-version: '21'

      # Cache de Gradle (acción de terceros). Si los errores de caché persisten,
      # se puede reemplazar por actions/cache@v4 (ver ejemplo comentado abajo)
      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v1
        # Alternativa con actions/cache:
        # uses: actions/cache@v4
        # with:
        #   path: |
        #     ~/.gradle/caches
        #     ~/.gradle/wrapper
        #   key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        #   restore-keys: |
        #     ${{ runner.os }}-gradle-

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
        run: ./gradlew build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ env.GPG_FINGERPRINT }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.EXTEN_TOKEN }}
        run: npm exec semantic-release